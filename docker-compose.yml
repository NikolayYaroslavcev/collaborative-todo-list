services:
  postgres:
    image: postgres:16-alpine
    container_name: collaborative-todo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: collaborative_todo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d collaborative_todo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
